<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f5f1">
    <title>Lernplaner</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <p class="eyebrow">DEIN LERNPLANER</p>
        <h1>Lernen mit Plan.</h1>
        <p class="intro">Sammle deine Aufgaben an einem Ort und behalte den Überblick.</p>
      </header>

      <section class="panel form-panel" aria-labelledby="form-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">NEUE AUFGABE</p>
            <h2 id="form-title">Was steht an?</h2>
          </div>
        </div>

        <form id="task-form">
          <div class="field">
            <label for="title">Titel</label>
            <input id="title" name="title" type="text" placeholder="z. B. Kapitel 4 wiederholen" required>
          </div>

          <div class="form-row">
            <div class="field">
              <label for="subject">Fach oder Thema</label>
              <input id="subject" name="subject" type="text" placeholder="z. B. Biologie" required>
            </div>
            <div class="field">
              <label for="due-date">Fälligkeitsdatum</label>
              <input id="due-date" name="dueDate" type="date" required>
            </div>
          </div>

          <div class="form-row form-row-bottom">
            <fieldset class="field priority-field">
              <legend>Priorität</legend>
              <div class="priority-options">
                <label class="priority-option">
                  <input type="radio" name="priority" value="hoch">
                  <span><i class="priority-dot high"></i>Hoch</span>
                </label>
                <label class="priority-option">
                  <input type="radio" name="priority" value="normal" checked>
                  <span><i class="priority-dot normal"></i>Normal</span>
                </label>
                <label class="priority-option">
                  <input type="radio" name="priority" value="niedrig">
                  <span><i class="priority-dot low"></i>Niedrig</span>
                </label>
              </div>
            </fieldset>
            <button class="add-button" type="submit"><span aria-hidden="true">＋</span> Aufgabe hinzufügen</button>
          </div>
        </form>
      </section>

      <section class="task-section" aria-labelledby="tasks-title">
        <div class="section-heading task-heading">
          <div>
            <p class="eyebrow">DEINE ÜBERSICHT</p>
            <h2 id="tasks-title">Aufgaben</h2>
          </div>
          <span id="task-count" class="task-count">0 Aufgaben</span>
        </div>
        <div class="task-filters" role="group" aria-label="Aufgaben nach Status filtern">
          <button class="filter-button is-active" type="button" data-filter="alle" aria-pressed="true">Alle</button>
          <button class="filter-button" type="button" data-filter="offen" aria-pressed="false">Offen</button>
          <button class="filter-button" type="button" data-filter="erledigt" aria-pressed="false">Erledigt</button>
        </div>
        <div id="task-list" class="task-list" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>
